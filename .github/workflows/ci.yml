name: CI Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  docker:
    name: Docker Build and Smoke Test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-demo:${{ github.sha }} .

      - name: Run container
        run: docker run -d --name smoke -p 3000:3000 devops-demo:${{ github.sha }}

      - name: Smoke test
        run: |
          sleep 5
          curl --fail http://localhost:3000/live
          curl --fail http://localhost:3000/

      - name: Show container logs
        if: always()
        run: docker logs smoke

  deploy:
    name: Deploy (${{ github.ref_name == 'main' && 'production' || 'staging' }})
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      IMAGE: ghcr.io/sandudm/devops-cicd-monitoring-app
      TAG: ${{ github.ref_name == 'main' && 'latest' || 'staging' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t $IMAGE:$TAG -t $IMAGE:${{ github.sha }} .

      - name: Push image
        run: |
          docker push $IMAGE:$TAG
          docker push $IMAGE:${{ github.sha }}